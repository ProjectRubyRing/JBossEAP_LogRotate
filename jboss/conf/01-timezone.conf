# =====================================================================
# JBoss EAP: JVM 既定タイムゾーンを JST に固定する
#
#   これが「ログローテーションのサフィックス TZ」を決める唯一の制御点。
#   logging サブシステムの periodic-rotating-file-handler /
#   periodic-size-rotating-file-handler には TZ 属性が無く、内部実装
#   (org.jboss.logmanager.handlers.PeriodicRotatingFileHandler) は
#   TimeZone.getDefault() を参照するため。
#
# ---------------------------------------------------------------------
# 適用方法（イメージビルド時に standalone.conf へ追記する）
#
#   Dockerfile:
#       COPY jboss/conf/01-timezone.conf /tmp/01-timezone.conf
#       RUN cat /tmp/01-timezone.conf >> $JBOSS_HOME/bin/standalone.conf \
#        && rm -f /tmp/01-timezone.conf
#
#   readonlyRootFilesystem: true の環境でも、上記はビルド時の操作なので問題ない。
#
# ---------------------------------------------------------------------
# 【注意】JAVA_OPTS を ECS タスク定義の環境変数で渡してはいけない
#
#   standalone.conf は先頭付近で
#       if [ "x$JAVA_OPTS" = "x" ]; then  JAVA_OPTS="-Xms... -Xmx... ..."
#       else  echo "JAVA_OPTS already set in environment; overriding default settings"
#   という分岐を行う。環境変数で JAVA_OPTS を設定すると、EAP 既定の
#   ヒープ・GC・メタスペース設定がすべて破棄される。
#   そのため TZ 指定は「standalone.conf への追記」で行う。
#
#   どうしても環境変数で渡したい場合は JAVA_TOOL_OPTIONS を使う
#   （JVM が自前で読み、既存の JAVA_OPTS を上書きしない）。
#       JAVA_TOOL_OPTIONS="-Duser.timezone=Asia/Tokyo"
#   ただし起動時に "Picked up JAVA_TOOL_OPTIONS" が stderr に出力され、
#   jboss-cli.sh など同居する全 JVM にも適用される点に注意。
# =====================================================================

# --- タイムゾーンを JST に固定 -----------------------------------------
#
# JDK は OS の /usr/share/zoneinfo ではなく **内蔵の tzdb** を参照するため、
# コンテナに tzdata パッケージが入っていなくても Asia/Tokyo が解決できる。
# これにより以下がすべて JST になる:
#   - periodic(-size)-rotating-file-handler の suffix（ファイル名の日付）
#   - ローテーション境界の計算
#   - pattern-formatter の %d が出力する時刻
#   - アプリケーションの LocalDateTime.now() / new Date() の既定 TZ
#
JAVA_OPTS="$JAVA_OPTS -Duser.timezone=Asia/Tokyo"

# ロケールも固定しておく（ログ中の月名・曜日表記が環境で揺れないように）
JAVA_OPTS="$JAVA_OPTS -Duser.language=ja -Duser.country=JP"

# ファイルエンコーディングを固定（CloudWatch Agent の encoding: utf-8 と揃える）
JAVA_OPTS="$JAVA_OPTS -Dfile.encoding=UTF-8"

# --- 検証用 ------------------------------------------------------------
# 起動後に実際の TZ を確認する:
#   $JBOSS_HOME/bin/jboss-cli.sh -c \
#     '/core-service=platform-mbean/type=runtime:read-attribute(name=system-properties)' \
#     | grep -i timezone
#
# もしくはコンテナ内で:
#   ps -ef | grep -o 'user.timezone=[^ ]*'
#   date        # OS 側の TZ（TZ 環境変数が効いているか）
